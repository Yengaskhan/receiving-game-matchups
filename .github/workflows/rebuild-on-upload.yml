# Rebuild the report whenever new Data Suite exports are pushed to main.
#
# Your weekly update is just: upload the six CSVs to data/raw/ on GitHub (same file names) and commit.
# This workflow then runs the pipeline, checks the site still builds, and commits the new data/<season>/
# files. Netlify redeploys on that commit. If an export changed format or a check fails, the run stops,
# GitHub emails you, nothing is committed, and the live site keeps the last good data.
#
# Run it by hand any time: GitHub -> Actions -> "Rebuild on upload" -> Run workflow (optionally a week).

name: Rebuild on upload

on:
  push:
    branches: [main]
    # Only new exports trigger a rebuild. Code changes are pushed with their data already rebuilt, so
    # running here too would only make a second commit (and a second Netlify deploy).
    paths:
      - "data/raw/**"
      - "data/team_map.csv"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (blank = nflverse's current week)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Pipeline tests
        run: python -m pytest -q pipeline/tests

      - name: Run pipeline
        # Stops (and the job fails) if an export's format changed or any check fails.
        run: python pipeline/run_receiving.py ${{ inputs.week && format('--week {0}', inputs.week) || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check the site builds with the new data
        # Same command Netlify runs: typecheck, tests (including every data file), build.
        run: |
          npm ci
          npm run build

      - name: Commit new data
        # Commits made with the workflow's token don't trigger workflows, so this can't loop.
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          label=$(python -c "import glob, json; i = json.load(open(sorted(glob.glob('data/*/index.json'))[-1])); print(f\"{i['season']} week {i['current_week']}, data as of {i['data_as_of']} UTC\")" 2>/dev/null || echo "latest data")
          git commit -m "Data refresh: ${label} (automatic)"
          git push
